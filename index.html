<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hive</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #101d2e;
    --surface: #172943;
    --surface-2: #1d3151;
    --ink: #e7edf5;
    --ink-soft: #a7bad2;
    --ink-faint: #6d84a0;
    --line: #263c58;
    --accent: #e0a94a;
    --accent-soft: #2b2414;
    --status-shipped: #6fbf98;
    --status-shipped-bg: #132922;
    --status-progress: #e0a94a;
    --status-progress-bg: #2b2414;
    --status-archived: #93a7c0;
    --status-archived-bg: #1b2c45;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
  }

  .page {
    max-width: 940px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 4rem;
  }

  .hero {
    margin-bottom: 1.5rem;
  }

  h1 {
    margin: 0 0 0.85rem;
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(2.6rem, 5vw, 3.4rem);
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--ink);
  }

  .tagline {
    margin: 0;
    max-width: 46ch;
    font-size: 1.05rem;
    color: var(--ink-soft);
    text-wrap: pretty;
  }

  /* ---------- 3D hive ---------- */

  .hive-scene {
    height: 440px;
    margin-top: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1500px;
  }

  .hive {
    position: relative;
    width: 1px;
    height: 1px;
    transform-style: preserve-3d;
    transform: rotateX(-12deg) rotateY(0deg);
    animation: hive-spin 38s linear infinite;
  }

  .hive:hover,
  .hive:focus-within {
    animation-play-state: paused;
  }

  @keyframes hive-spin {
    from { transform: rotateX(-12deg) rotateY(0deg); }
    to   { transform: rotateX(-12deg) rotateY(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hive { animation: none; }
  }

  .hive-ring {
    position: absolute;
    top: 0;
    left: 0;
    transform-style: preserve-3d;
  }

  .hive-ring--top { transform: translateY(-140px); }
  .hive-ring--mid { transform: translateY(0); }
  .hive-ring--bottom { transform: translateY(140px); }

  .hex {
    position: absolute;
    top: 50%;
    left: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    backface-visibility: hidden;
    text-decoration: none;
    color: inherit;
  }

  .hive-ring--top .hex,
  .hive-ring--bottom .hex {
    width: 108px;
    height: 94px;
    margin: -47px 0 0 -54px;
    transform: rotateY(calc(var(--i) * 90deg)) translateZ(110px) scale(var(--hs, 1));
    background: linear-gradient(150deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line);
    opacity: 0.55;
  }

  .hive-ring--mid .hex {
    width: 172px;
    height: 150px;
    margin: -75px 0 0 -86px;
    transform: rotateY(calc(var(--i) * 60deg)) translateZ(195px) scale(var(--hs, 1));
    background: linear-gradient(150deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line);
  }

  .hex--empty { cursor: default; }

  .hex--filled {
    cursor: pointer;
    border-color: var(--accent);
    transition: transform 0.2s ease;
  }

  .hex--filled:hover,
  .hex--filled:focus-visible {
    --hs: 1.08;
    outline: none;
  }

  .hex--filled:focus-visible {
    border-color: var(--ink);
  }

  .hex-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    width: 68%;
    text-align: center;
  }

  .hex-index {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.66rem;
    color: var(--ink-faint);
  }

  .hex-name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 0.98rem;
    line-height: 1.15;
    color: var(--ink);
  }

  .hex-status {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 0.15rem 0.45rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .hex-status--shipped { color: var(--status-shipped); background: var(--status-shipped-bg); }
  .hex-status--progress { color: var(--status-progress); background: var(--status-progress-bg); }
  .hex-status--archived { color: var(--status-archived); background: var(--status-archived-bg); }

  .hive-caption {
    margin: 0.5rem 0 0;
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-faint);
  }

  @media (max-width: 640px) {
    .hive-scene { height: 420px; }
    .hive { transform: rotateX(-12deg) rotateY(0deg) scale(0.62); }
    @keyframes hive-spin {
      from { transform: rotateX(-12deg) rotateY(0deg) scale(0.62); }
      to   { transform: rotateX(-12deg) rotateY(360deg) scale(0.62); }
    }
  }

  footer {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <h1>The Hive</h1>
    <p class="tagline">Every project I've designed, collected in one place.</p>
  </header>

  <div class="hive-scene">
    <div class="hive">
      <div class="hive-ring hive-ring--top">
        <span class="hex hex--empty" style="--i:0" aria-hidden="true"></span>
        <span class="hex hex--empty" style="--i:1" aria-hidden="true"></span>
        <span class="hex hex--empty" style="--i:2" aria-hidden="true"></span>
        <span class="hex hex--empty" style="--i:3" aria-hidden="true"></span>
      </div>

      <div class="hive-ring hive-ring--mid">
        <a class="hex hex--filled" href="/fpl/" style="--i:0">
          <span class="hex-inner">
            <span class="hex-index">№ 002</span>
            <span class="hex-name">FPL Team Manager</span>
            <span class="hex-status hex-status--shipped">Shipped</span>
          </span>
        </a>
        <span class="hex hex--empty" style="--i:1" aria-hidden="true"></span>
        <span class="hex hex--empty" style="--i:2" aria-hidden="true"></span>
        <a class="hex hex--filled" href="/to-do-list/" style="--i:3">
          <span class="hex-inner">
            <span class="hex-index">№ 001</span>
            <span class="hex-name">To-Do List</span>
            <span class="hex-status hex-status--shipped">Shipped</span>
          </span>
        </a>
        <span class="hex hex--empty" style="--i:4" aria-hidden="true"></span>
        <span class="hex hex--empty" style="--i:5" aria-hidden="true"></span>
      </div>

      <div class="hive-ring hive-ring--bottom">
        <span class="hex hex--empty" style="--i:0" aria-hidden="true"></span>
        <span class="hex hex--empty" style="--i:1" aria-hidden="true"></span>
        <span class="hex hex--empty" style="--i:2" aria-hidden="true"></span>
        <span class="hex hex--empty" style="--i:3" aria-hidden="true"></span>
      </div>
    </div>
  </div>
  <p class="hive-caption">Hover to pause the hive, click a filled cell to open a project.</p>

  <footer>
    Maintained with Claude Code · last updated Sep 2026
  </footer>
</div>
</body>
</html>
