<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hive</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #101d2e;
    --surface: #172943;
    --ink: #e7edf5;
    --ink-soft: #a7bad2;
    --ink-faint: #6d84a0;
    --line: #263c58;
    --accent: #e0a94a;
    --accent-soft: #2b2414;
    --status-shipped: #6fbf98;
    --status-shipped-bg: #132922;
    --status-progress: #e0a94a;
    --status-progress-bg: #2b2414;
    --status-archived: #93a7c0;
    --status-archived-bg: #1b2c45;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
  }

  .page {
    max-width: 940px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 4rem;
  }

  .hero {
    margin-bottom: 1.5rem;
  }

  h1 {
    margin: 0 0 0.85rem;
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(2.6rem, 5vw, 3.4rem);
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--ink);
  }

  .tagline {
    margin: 0;
    max-width: 46ch;
    font-size: 1.05rem;
    color: var(--ink-soft);
    text-wrap: pretty;
  }

  /* ---------- 3D hive ---------- */

  .hive-scene {
    position: relative;
    height: 460px;
    margin-top: 0.5rem;
  }

  #hive-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hive-tooltip {
    position: absolute;
    top: 0;
    left: 0;
    padding: 0.4rem 0.7rem;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 6px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .hive-caption {
    margin: 0.5rem 0 0;
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-faint);
  }

  .hive-caption a {
    color: var(--accent);
    text-decoration: none;
  }

  .hive-caption a:hover { text-decoration: underline; }
  .hive-caption a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 640px) {
    .hive-scene { height: 340px; }
  }

  footer {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <h1>The Hive</h1>
    <p class="tagline">Every project I've designed, collected in one place.</p>
  </header>

  <div class="hive-scene" id="hive-scene">
    <canvas id="hive-canvas"></canvas>
    <div class="hive-tooltip" id="hive-tooltip"></div>
  </div>
  <p class="hive-caption">
    Hover to pause the hive, click a glowing cell to open a project — or jump straight to
    <a href="/to-do-list/">To-Do List</a> · <a href="/fpl/">FPL Team Manager</a>.
  </p>

  <footer>
    Maintained with Claude Code · last updated Sep 2026
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('hive-canvas');
  var sceneEl = document.getElementById('hive-scene');
  var tooltip = document.getElementById('hive-tooltip');
  if (typeof THREE === 'undefined' || !canvas) return;

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var PROJECTS = [
    { name: 'To-Do List', status: 'Shipped', label: '№ 001', href: '/to-do-list/' },
    { name: 'FPL Team Manager', status: 'Shipped', label: '№ 002', href: '/fpl/' }
  ];

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 1.5, 12.5);
  camera.lookAt(0, 0, 0);

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  scene.add(new THREE.AmbientLight(0x8fa3c0, 0.85));
  var key = new THREE.DirectionalLight(0xffd9a0, 0.65);
  key.position.set(4, 5, 6);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0x5577cc, 0.4);
  rim.position.set(-5, -2, -4);
  scene.add(rim);

  var hive = new THREE.Group();
  hive.rotation.x = -0.18;
  scene.add(hive);

  var SPHERE_R = 3.2;
  var HEX_R = 1.18;
  var COUNT = 70;

  // Beehive (skep) silhouette, defined as radius-at-height control points
  // from top to base: a tight tapered crown, a flared shoulder, and a
  // rounded, broader foot -- deliberately asymmetric, unlike a sphere.
  var HIVE_PROFILE = [
    [1.00, 0.10],
    [0.65, 0.50],
    [0.25, 0.95],
    [0.00, 1.00],
    [-0.25, 1.10],
    [-0.55, 1.06],
    [-0.85, 0.88],
    [-1.00, 0.64]
  ];
  function hiveProfile(y) {
    for (var j = 0; j < HIVE_PROFILE.length - 1; j++) {
      var a = HIVE_PROFILE[j], b = HIVE_PROFILE[j + 1];
      if (y <= a[0] && y >= b[0]) {
        var t = (a[0] - y) / (a[0] - b[0]);
        return a[1] + (b[1] - a[1]) * t;
      }
    }
    return 1.0;
  }

  var points = [];
  var golden = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < COUNT; i++) {
    var y = 1 - (i / (COUNT - 1)) * 2;
    var radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
    var theta = golden * i;
    var azX = radiusAtY > 1e-6 ? Math.cos(theta) : 0;
    var azZ = radiusAtY > 1e-6 ? Math.sin(theta) : 0;
    var profileR = hiveProfile(y);
    points.push(new THREE.Vector3(azX * profileR, y * 1.15, azZ * profileR));
  }

  function azimuth(p) { return Math.atan2(p.z, p.x); }

  var equatorial = [];
  points.forEach(function (p, idx) {
    if (Math.abs(p.y) < 0.28) equatorial.push(idx);
  });

  var used = {};
  var projectIndices = [];
  for (var k = 0; k < PROJECTS.length; k++) {
    var targetAngle = (k / PROJECTS.length) * Math.PI * 2;
    var best = null, bestDiff = Infinity;
    equatorial.forEach(function (idx) {
      if (used[idx]) return;
      var a = azimuth(points[idx]);
      var diff = Math.abs(Math.atan2(Math.sin(a - targetAngle), Math.cos(a - targetAngle)));
      if (diff < bestDiff) { bestDiff = diff; best = idx; }
    });
    if (best !== null) { used[best] = true; projectIndices.push(best); }
  }

  // Guarantee a visible gap (never an overlap) between every cell and its
  // closest neighbour: size each hex off its own nearest-neighbour
  // distance rather than a single fixed radius.
  var worldPos = points.map(function (p) { return p.clone().multiplyScalar(SPHERE_R); });
  var nearestDist = worldPos.map(function (p, i) {
    var min = Infinity;
    for (var j = 0; j < worldPos.length; j++) {
      if (j === i) continue;
      var d = p.distanceTo(worldPos[j]);
      if (d < min) min = d;
    }
    return min;
  });

  function hexShape(r) {
    var shape = new THREE.Shape();
    for (var s = 0; s < 6; s++) {
      var ang = (Math.PI / 3) * s;
      var x = Math.cos(ang) * r;
      var y = Math.sin(ang) * r;
      if (s === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
    }
    shape.closePath();
    return shape;
  }

  function hexGeo(r) {
    var geo = new THREE.ExtrudeGeometry(hexShape(r), {
      depth: 0.16,
      bevelEnabled: true,
      bevelThickness: 0.06,
      bevelSize: r * 0.1,
      bevelSegments: 3,
      curveSegments: 1
    });
    geo.translate(0, 0, -0.08);
    return geo;
  }

  // material index 0 = extruded sides + bevel (the darker rim),
  // material index 1 = the flat front/back caps (the glossy face)
  var rimMat = new THREE.MeshStandardMaterial({ color: 0xa9691f, roughness: 0.6, metalness: 0.05 });
  var capMat = new THREE.MeshPhysicalMaterial({
    color: 0xf7c948,
    roughness: 0.35,
    metalness: 0.05,
    clearcoat: 0.5,
    clearcoatRoughness: 0.4
  });
  var projectRimMat = new THREE.MeshStandardMaterial({ color: 0xc47a1f, roughness: 0.5, metalness: 0.08 });
  var projectCapMat = new THREE.MeshPhysicalMaterial({
    color: 0xffe08a,
    emissive: 0x4a2c06,
    emissiveIntensity: 0.5,
    roughness: 0.28,
    metalness: 0.05,
    clearcoat: 0.65,
    clearcoatRoughness: 0.3
  });

  var fwd = new THREE.Vector3(0, 0, 1);
  var projectMeshes = [];

  points.forEach(function (dir, idx) {
    var pIdx = projectIndices.indexOf(idx);
    var pos = dir.clone().multiplyScalar(SPHERE_R);
    var normalDir = dir.clone().normalize();
    var r = Math.min(nearestDist[idx] * 0.48, HEX_R);

    if (pIdx !== -1) {
      var pdata = PROJECTS[pIdx];
      var geo = hexGeo(r * 1.12);
      var mesh = new THREE.Mesh(geo, [projectCapMat, projectRimMat]);
      mesh.position.copy(pos);
      mesh.quaternion.setFromUnitVectors(fwd, normalDir);
      mesh.userData.project = pdata;
      hive.add(mesh);
      projectMeshes.push(mesh);
    } else {
      var cellGeo = hexGeo(r);
      var cellMesh = new THREE.Mesh(cellGeo, [capMat, rimMat]);
      cellMesh.position.copy(pos);
      cellMesh.quaternion.setFromUnitVectors(fwd, normalDir);
      hive.add(cellMesh);
    }
  });

  function resize() {
    var w = sceneEl.clientWidth || 1;
    var h = sceneEl.clientHeight || 1;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  window.addEventListener('resize', resize);
  resize();

  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();
  var hovered = null;
  var paused = false;

  function pointerAt(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(projectMeshes);
    if (hits.length) {
      hovered = hits[0].object;
      paused = true;
      canvas.style.cursor = 'pointer';
      tooltip.textContent = hovered.userData.project.name + ' — ' + hovered.userData.project.status;
      tooltip.style.opacity = '1';
      tooltip.style.transform = 'translate(' + (clientX - rect.left + 14) + 'px,' + (clientY - rect.top + 10) + 'px)';
    } else {
      hovered = null;
      paused = false;
      canvas.style.cursor = 'default';
      tooltip.style.opacity = '0';
    }
  }

  canvas.addEventListener('mousemove', function (e) {
    pointerAt(e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseleave', function () {
    hovered = null;
    paused = false;
    canvas.style.cursor = 'default';
    tooltip.style.opacity = '0';
  });
  canvas.addEventListener('click', function (e) {
    pointerAt(e.clientX, e.clientY);
    if (hovered) window.location.href = hovered.userData.project.href;
  });
  canvas.addEventListener('touchend', function (e) {
    if (!e.changedTouches.length) return;
    var t = e.changedTouches[0];
    pointerAt(t.clientX, t.clientY);
    if (hovered) window.location.href = hovered.userData.project.href;
  });

  var clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    if (!paused && !reduceMotion) {
      hive.rotation.y += dt * 0.18;
    }
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
