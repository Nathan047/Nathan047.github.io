<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #070A10;
    --surface: #101B33;
    --surface-2: #17284A;
    --ink: #F1F5FB;
    --ink-soft: #A9BEDE;
    --ink-faint: #869CC0;
    --line: #26406E;
    --accent: #FFC93C;
    --on-accent: #070A10;
    --bad: #F2796B;
    --work: #4D8DFF;
    --holiday: #63D3A0;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 4rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 1.75rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .back-link:hover { text-decoration: underline; }
  .back-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hero {
    margin-bottom: 2rem;
  }

  h1 {
    margin: 0 0 0.5rem;
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: 2.6rem;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .tagline {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }

  .cal-nav-btn {
    flex: none;
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .cal-nav-btn:hover { border-color: var(--accent); }
  .cal-nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-month-label {
    flex: 1;
    text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 1.35rem;
  }

  .cal-today-row {
    text-align: center;
    margin-bottom: 1.25rem;
  }

  .cal-today-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .cal-today-btn:hover { text-decoration: underline; }
  .cal-today-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-weekdays,
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .cal-weekdays {
    margin-bottom: 0.5rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
  }

  .cal-grid {
    margin-bottom: 1.5rem;
  }

  .cal-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  }

  .cal-day:hover { border-color: var(--accent); }
  .cal-day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-day.is-today { border-color: var(--accent); border-width: 2px; }

  .cal-day.is-selected {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }

  .cal-day.is-selected .cal-day-dot,
  .cal-day.is-selected .cal-day-work-dot,
  .cal-day.is-selected .cal-day-holiday-dot { background: var(--on-accent); }

  .cal-day-empty {
    background: none;
    border: none;
    cursor: default;
  }

  /* Up to three markers per cell, each in a fixed spot so they never
     rearrange depending on which combination is present: work-rota at
     top-center, holiday at bottom-left, has-a-note at bottom-right. The
     date number stays the only flex-centered child. */
  .cal-day-work-dot,
  .cal-day-holiday-dot,
  .cal-day-dot {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
  }

  .cal-day-work-dot {
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--work);
  }

  .cal-day-holiday-dot {
    bottom: 6px;
    left: 8px;
    background: var(--holiday);
  }

  .cal-day-dot {
    bottom: 6px;
    right: 8px;
    background: var(--accent);
  }

  .cal-legend {
    display: flex;
    gap: 1.1rem;
    margin: -0.75rem 0 1.5rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
  }

  .cal-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .cal-legend-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: none;
  }

  .cal-legend-dot--work { background: var(--work); }
  .cal-legend-dot--holiday { background: var(--holiday); }
  .cal-legend-dot--note { background: var(--accent); }

  .cal-note-panel {
    padding: 1rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 1.5rem;
  }

  .cal-note-date {
    margin-bottom: 0.65rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  .cal-note-row {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
  }

  #cal-note-input {
    flex: 1;
    min-width: 0;
    padding: 0.6rem 0.8rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.95rem;
  }

  #cal-note-input::placeholder { color: var(--ink-faint); }
  #cal-note-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-note-delete {
    background: none;
    border: none;
    padding: 0;
    color: var(--ink-faint);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .cal-note-delete:hover { color: var(--bad); }
  .cal-note-delete:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-note-extra {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
  }

  .cal-note-toggles {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.9rem;
  }

  .cal-holiday-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    color: var(--ink-soft);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .cal-holiday-toggle input {
    width: 16px;
    height: 16px;
    accent-color: var(--holiday);
    cursor: pointer;
  }

  .cal-holiday-toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-workday-toggle input { accent-color: var(--work); }

  /* Reuses the same muted look as "Delete note", but a swap/reset is not
     destructive the way deleting a note is, so its hover color stays the
     accent rather than the "bad" red. */
  #cal-note-workday-reset:hover { color: var(--accent); }

  .cal-range-panel {
    padding: 1rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 1.5rem;
  }

  .cal-range-title {
    margin-bottom: 0.65rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  .cal-range-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
  }

  .cal-range-row input[type="date"],
  .cal-range-row input[type="text"] {
    padding: 0.6rem 0.8rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.9rem;
    color-scheme: dark;
  }

  .cal-range-row input[type="text"] {
    flex: 1;
    min-width: 140px;
  }

  .cal-range-row input::placeholder { color: var(--ink-faint); }
  .cal-range-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-range-to {
    color: var(--ink-faint);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
  }

  .cal-range-row button {
    flex: none;
    padding: 0.6rem 1.05rem;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 6px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .cal-range-row button:hover { filter: brightness(1.08); }
  .cal-range-row button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .cal-upcoming-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .cal-upcoming-empty {
    margin: 0;
    color: var(--ink-faint);
    font-size: 0.85rem;
  }

  .cal-upcoming-btn {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    width: 100%;
    padding: 0.55rem 0.7rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.88rem;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .cal-upcoming-btn:hover { border-color: var(--accent); }
  .cal-upcoming-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-upcoming-date {
    flex: none;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    min-width: 3.6rem;
  }

  .cal-upcoming-note {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cal-upcoming-tag {
    flex: none;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: rgba(99, 211, 160, 0.15);
    color: var(--holiday);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .cal-rota-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .cal-rota-row label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .cal-rota-row input[type="date"] {
    padding: 0.5rem 0.7rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.88rem;
    color-scheme: dark;
  }

  .cal-rota-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-rota-week { margin-bottom: 0.9rem; }
  .cal-rota-week:last-child { margin-bottom: 0; }

  .cal-rota-week-label {
    margin-bottom: 0.5rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .cal-rota-days {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .cal-rota-day {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.4rem 0.65rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-soft);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .cal-rota-day:has(input:checked) {
    border-color: var(--work);
    color: var(--ink);
  }

  .cal-rota-day input {
    width: 14px;
    height: 14px;
    accent-color: var(--work);
    cursor: pointer;
  }

  .cal-rota-day input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-data-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .cal-data-btn {
    display: inline-flex;
    align-items: center;
    padding: 0.6rem 1.05rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .cal-data-btn:hover { border-color: var(--accent); }
  .cal-data-btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-data-status {
    margin-top: 0.6rem;
    min-height: 1.1em;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-faint);
  }

  #footer {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="/#all-projects">← All projects</a>
  <header class="hero">
    <h1>Calendar</h1>
    <p class="tagline">A month at a glance — click a day to leave yourself a note.</p>
  </header>

  <div class="cal-nav">
    <button type="button" class="cal-nav-btn" id="cal-prev" aria-label="Previous month">←</button>
    <div class="cal-month-label" id="cal-month-label"></div>
    <button type="button" class="cal-nav-btn" id="cal-next" aria-label="Next month">→</button>
  </div>
  <div class="cal-today-row">
    <button type="button" class="cal-today-btn" id="cal-today">Today</button>
  </div>

  <div class="cal-weekdays">
    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
  </div>
  <div class="cal-grid" id="cal-grid-days"></div>
  <div class="cal-legend">
    <span class="cal-legend-item"><span class="cal-legend-dot cal-legend-dot--work" aria-hidden="true"></span>Work day</span>
    <span class="cal-legend-item"><span class="cal-legend-dot cal-legend-dot--holiday" aria-hidden="true"></span>Holiday</span>
    <span class="cal-legend-item"><span class="cal-legend-dot cal-legend-dot--note" aria-hidden="true"></span>Has a note</span>
  </div>

  <div class="cal-range-panel">
    <div class="cal-range-title">Upcoming</div>
    <ul class="cal-upcoming-list" id="cal-upcoming-list"></ul>
  </div>

  <div class="cal-note-panel">
    <div class="cal-note-date" id="cal-note-date"></div>
    <div class="cal-note-row">
      <input type="text" id="cal-note-input" placeholder="Add a note for this day…" autocomplete="off">
    </div>
    <div class="cal-note-extra">
      <div class="cal-note-toggles">
        <label class="cal-holiday-toggle cal-workday-toggle">
          <input type="checkbox" id="cal-note-workday">
          Work day
        </label>
        <label class="cal-holiday-toggle">
          <input type="checkbox" id="cal-note-holiday">
          Holiday
        </label>
        <button type="button" class="cal-note-delete" id="cal-note-workday-reset" hidden>Reset to rota</button>
      </div>
      <button type="button" class="cal-note-delete" id="cal-note-delete" hidden>Delete note</button>
    </div>
  </div>

  <div class="cal-range-panel">
    <div class="cal-range-title">Apply to a range of days</div>
    <form class="cal-range-row" id="cal-range-form" autocomplete="off">
      <input type="date" id="cal-range-start" aria-label="Start date" required>
      <span class="cal-range-to">to</span>
      <input type="date" id="cal-range-end" aria-label="End date" required>
      <input type="text" id="cal-range-note" placeholder="Note (optional)" aria-label="Note text">
      <label class="cal-holiday-toggle">
        <input type="checkbox" id="cal-range-holiday">
        Holiday
      </label>
      <button type="submit">Apply</button>
    </form>
  </div>

  <div class="cal-range-panel">
    <div class="cal-range-title">Work rota</div>
    <div class="cal-rota-row">
      <label for="cal-rota-anchor">Week A starts</label>
      <input type="date" id="cal-rota-anchor">
    </div>
    <div class="cal-rota-week">
      <div class="cal-rota-week-label">Week A</div>
      <div class="cal-rota-days" id="cal-rota-week-a"></div>
    </div>
    <div class="cal-rota-week">
      <div class="cal-rota-week-label">Week B</div>
      <div class="cal-rota-days" id="cal-rota-week-b"></div>
    </div>
  </div>

  <div class="cal-range-panel">
    <div class="cal-range-title">Backup &amp; restore</div>
    <div class="cal-data-row">
      <button type="button" class="cal-data-btn" id="cal-export-btn">Export backup</button>
      <label class="cal-data-btn" for="cal-import-input">
        Import backup
        <input type="file" id="cal-import-input" accept="application/json,.json" hidden>
      </label>
    </div>
    <div class="cal-data-status" id="cal-data-status" aria-live="polite"></div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
  var STORAGE_KEY = 'hive-calendar-notes';
  var HOLIDAY_STORAGE_KEY = 'hive-calendar-holidays';
  var WORK_OVERRIDE_STORAGE_KEY = 'hive-calendar-work-overrides';
  var ROTA_STORAGE_KEY = 'hive-calendar-rota';
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  var WEEKDAY_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var WEEKDAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function loadNotes() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveNotes() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    } catch (e) {}
  }

  // Holidays are their own true/false map, separate from freeform notes --
  // a day can be a holiday, have a note, or both, independently.
  function loadHolidays() {
    try {
      var raw = localStorage.getItem(HOLIDAY_STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveHolidays() {
    try {
      localStorage.setItem(HOLIDAY_STORAGE_KEY, JSON.stringify(holidays));
    } catch (e) {}
  }

  // Rota exceptions: a per-day true/false override for isWorkDay(), so a
  // swapped shift or a one-off day off doesn't require lying via a note.
  // Absent from this map, a day just uses the computed rota (below).
  function loadWorkOverrides() {
    try {
      var raw = localStorage.getItem(WORK_OVERRIDE_STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveWorkOverrides() {
    try {
      localStorage.setItem(WORK_OVERRIDE_STORAGE_KEY, JSON.stringify(workOverrides));
    } catch (e) {}
  }

  // The work rota itself: a 2-week rotating pattern, editable in the
  // "Work rota" panel rather than hardcoded, so a real schedule change
  // doesn't require editing source. anchorMonday is the Monday that starts
  // "Week A"; weekA/weekB are arrays of weekday numbers (0=Sun..6=Sat).
  var DEFAULT_ROTA = {
    anchorMonday: '2026-09-14', // Monday, Sep 14 2026
    weekA: [3, 4, 5, 6, 0], // Wed, Thu, Fri, Sat, Sun
    weekB: [2, 3, 4]        // Tue, Wed, Thu
  };

  function loadRota() {
    try {
      var raw = localStorage.getItem(ROTA_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed.anchorMonday === 'string' && Array.isArray(parsed.weekA) && Array.isArray(parsed.weekB)) {
        return parsed;
      }
      return DEFAULT_ROTA;
    } catch (e) {
      return DEFAULT_ROTA;
    }
  }

  function saveRota() {
    try {
      localStorage.setItem(ROTA_STORAGE_KEY, JSON.stringify(rota));
    } catch (e) {}
  }

  var notes = loadNotes();
  var holidays = loadHolidays();
  var workOverrides = loadWorkOverrides();
  var rota = loadRota();
  var today = new Date();

  function utcDayCount(d) {
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  function mondayOf(d) {
    var day = d.getDay(); // 0 = Sun .. 6 = Sat
    var diff = day === 0 ? -6 : 1 - day;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  }

  function isWorkDay(d) {
    var anchor = mondayOf(parseKey(rota.anchorMonday));
    var weeksSince = Math.floor((utcDayCount(mondayOf(d)) - utcDayCount(anchor)) / 7);
    var weekIndex = ((weeksSince % 2) + 2) % 2; // normalize to 0/1 for negative weeksSince too
    var pattern = weekIndex === 0 ? rota.weekA : rota.weekB;
    return pattern.indexOf(d.getDay()) !== -1;
  }

  // The rota's computed value, unless this specific day has an explicit
  // override on file (a swapped shift, a one-off day off or extra shift).
  function effectiveIsWorkDay(d) {
    var key = dateKey(d);
    return workOverrides.hasOwnProperty(key) ? workOverrides[key] : isWorkDay(d);
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(key) {
    var parts = key.split('-');
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  function formatLong(d) {
    return WEEKDAY_LONG[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate();
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();
  var selectedKey = dateKey(today);

  function buildDayCellHTML(key, day, isToday, isSelected) {
    var hasNote = !!(notes[key] && notes[key].trim());
    var isHoliday = !!holidays[key];
    var isWork = effectiveIsWorkDay(parseKey(key));
    var label = MONTH_NAMES[parseKey(key).getMonth()] + ' ' + day +
      (isWork ? ', work day' : '') + (isHoliday ? ', holiday' : '') + (hasNote ? ', has a note' : '');
    return '<button type="button" class="cal-day' + (isToday ? ' is-today' : '') + (isSelected ? ' is-selected' : '') +
      '" data-key="' + key + '" aria-label="' + label + '" aria-pressed="' + isSelected + '">' +
        (isWork ? '<span class="cal-day-work-dot" aria-hidden="true"></span>' : '') +
        '<span class="cal-day-num">' + day + '</span>' +
        (isHoliday ? '<span class="cal-day-holiday-dot" aria-hidden="true"></span>' : '') +
        (hasNote ? '<span class="cal-day-dot" aria-hidden="true"></span>' : '') +
      '</button>';
  }

  function renderGrid() {
    var first = new Date(viewYear, viewMonth, 1);
    var startOffset = first.getDay();
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    var todayKey = dateKey(today);
    var cells = [];

    for (var i = 0; i < startOffset; i++) {
      cells.push('<div class="cal-day cal-day-empty" aria-hidden="true"></div>');
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var key = viewYear + '-' + pad(viewMonth + 1) + '-' + pad(day);
      cells.push(buildDayCellHTML(key, day, key === todayKey, key === selectedKey));
    }

    document.getElementById('cal-grid-days').innerHTML = cells.join('');
    document.getElementById('cal-month-label').textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;
  }

  // Patches a single day cell in place (e.g. after autosaving a note),
  // instead of rebuilding the whole grid and stealing focus/cursor
  // position from the note input the user is still typing in.
  function refreshDayCell(key) {
    var btn = document.querySelector('.cal-day[data-key="' + key + '"]');
    if (!btn) return;
    btn.outerHTML = buildDayCellHTML(key, parseKey(key).getDate(), key === dateKey(today), key === selectedKey);
  }

  function renderNotePanel() {
    var d = parseKey(selectedKey);
    document.getElementById('cal-note-date').textContent =
      formatLong(d) + (effectiveIsWorkDay(d) ? ' · Work day' : '');
    document.getElementById('cal-note-input').value = notes[selectedKey] || '';
    document.getElementById('cal-note-delete').hidden = !notes[selectedKey];
    document.getElementById('cal-note-holiday').checked = !!holidays[selectedKey];
    document.getElementById('cal-note-workday').checked = effectiveIsWorkDay(d);
    document.getElementById('cal-note-workday-reset').hidden = !workOverrides.hasOwnProperty(selectedKey);
  }

  function renderFooter() {
    var count = Object.keys(notes).filter(function (k) { return notes[k] && notes[k].trim(); }).length;
    document.getElementById('footer').textContent = count
      ? (count === 1 ? '1 note saved' : count + ' notes saved')
      : '';
  }

  // Lists the next few upcoming notes/holidays (today onward) so they can
  // be scanned at a glance instead of paging month to month to find them.
  function renderUpcoming() {
    var todayKey = dateKey(today);
    var keys = {};
    Object.keys(notes).forEach(function (k) { if (notes[k] && notes[k].trim()) keys[k] = true; });
    Object.keys(holidays).forEach(function (k) { if (holidays[k]) keys[k] = true; });

    var upcoming = Object.keys(keys).filter(function (k) { return k >= todayKey; }).sort().slice(0, 8);
    var listEl = document.getElementById('cal-upcoming-list');

    if (!upcoming.length) {
      listEl.innerHTML = '<li class="cal-upcoming-empty">Nothing coming up.</li>';
      return;
    }

    listEl.innerHTML = upcoming.map(function (key) {
      var d = parseKey(key);
      var bits = '';
      if (notes[key] && notes[key].trim()) bits += '<span class="cal-upcoming-note">' + escapeHtml(notes[key]) + '</span>';
      if (holidays[key]) bits += '<span class="cal-upcoming-tag">Holiday</span>';
      return '<li><button type="button" class="cal-upcoming-btn" data-key="' + key + '">' +
        '<span class="cal-upcoming-date">' + MONTH_NAMES[d.getMonth()].slice(0, 3) + ' ' + d.getDate() + '</span>' +
        bits +
        '</button></li>';
    }).join('');
  }

  function render() {
    renderGrid();
    renderNotePanel();
    renderFooter();
    renderUpcoming();
  }

  function goToMonth(year, month) {
    viewYear = year;
    viewMonth = month;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  }

  document.getElementById('cal-prev').addEventListener('click', function () {
    goToMonth(viewYear, viewMonth - 1);
  });
  document.getElementById('cal-next').addEventListener('click', function () {
    goToMonth(viewYear, viewMonth + 1);
  });
  document.getElementById('cal-today').addEventListener('click', function () {
    selectedKey = dateKey(today);
    goToMonth(today.getFullYear(), today.getMonth());
  });

  document.getElementById('cal-grid-days').addEventListener('click', function (e) {
    var btn = e.target.closest('.cal-day[data-key]');
    if (!btn) return;
    selectedKey = btn.dataset.key;
    render();
  });

  document.getElementById('cal-upcoming-list').addEventListener('click', function (e) {
    var btn = e.target.closest('.cal-upcoming-btn');
    if (!btn) return;
    var d = parseKey(btn.dataset.key);
    selectedKey = btn.dataset.key;
    goToMonth(d.getFullYear(), d.getMonth());
  });

  var noteSaveTimer = null;

  function commitNoteInput() {
    var text = document.getElementById('cal-note-input').value.trim();
    if (text) {
      notes[selectedKey] = text;
    } else {
      delete notes[selectedKey];
    }
    saveNotes();
    document.getElementById('cal-note-delete').hidden = !notes[selectedKey];
    refreshDayCell(selectedKey);
    renderFooter();
    renderUpcoming();
  }

  document.getElementById('cal-note-input').addEventListener('input', function () {
    clearTimeout(noteSaveTimer);
    noteSaveTimer = setTimeout(commitNoteInput, 400);
  });

  document.getElementById('cal-note-input').addEventListener('blur', function () {
    clearTimeout(noteSaveTimer);
    commitNoteInput();
  });

  // Flush a pending debounced save if the tab is closed/backgrounded
  // mid-keystroke, so the last few characters typed are never lost.
  window.addEventListener('pagehide', function () {
    clearTimeout(noteSaveTimer);
    commitNoteInput();
  });

  document.getElementById('cal-note-delete').addEventListener('click', function () {
    clearTimeout(noteSaveTimer);
    delete notes[selectedKey];
    saveNotes();
    render();
  });

  document.getElementById('cal-note-holiday').addEventListener('change', function (e) {
    if (e.target.checked) {
      holidays[selectedKey] = true;
    } else {
      delete holidays[selectedKey];
    }
    saveHolidays();
    render();
  });

  document.getElementById('cal-note-workday').addEventListener('change', function (e) {
    workOverrides[selectedKey] = e.target.checked;
    saveWorkOverrides();
    render();
  });

  document.getElementById('cal-note-workday-reset').addEventListener('click', function () {
    delete workOverrides[selectedKey];
    saveWorkOverrides();
    render();
  });

  document.getElementById('cal-range-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var startInput = document.getElementById('cal-range-start');
    var endInput = document.getElementById('cal-range-end');
    var text = document.getElementById('cal-range-note').value.trim();
    var holidayCheck = document.getElementById('cal-range-holiday');
    var markHoliday = holidayCheck.checked;
    if (!startInput.value || !endInput.value || (!text && !markHoliday)) return;

    // <input type="date">'s value is always "YYYY-MM-DD", the same shape
    // as our own dateKey()s, so it can be parsed with parseKey() directly.
    var start = parseKey(startInput.value);
    var end = parseKey(endInput.value);
    if (start > end) { var tmp = start; start = end; end = tmp; }

    var cursor = new Date(start);
    while (cursor <= end) {
      var key = dateKey(cursor);
      if (text) notes[key] = text;
      if (markHoliday) holidays[key] = true;
      cursor.setDate(cursor.getDate() + 1);
    }
    saveNotes();
    saveHolidays();

    selectedKey = dateKey(start);
    goToMonth(start.getFullYear(), start.getMonth());
    e.target.reset();
  });

  function renderRotaCheckboxes(containerId, pattern) {
    var html = '';
    for (var i = 0; i < 7; i++) {
      html += '<label class="cal-rota-day"><input type="checkbox" data-day="' + i + '"' +
        (pattern.indexOf(i) !== -1 ? ' checked' : '') + '>' + WEEKDAY_SHORT[i] + '</label>';
    }
    document.getElementById(containerId).innerHTML = html;
  }

  function renderRota() {
    document.getElementById('cal-rota-anchor').value = rota.anchorMonday;
    renderRotaCheckboxes('cal-rota-week-a', rota.weekA);
    renderRotaCheckboxes('cal-rota-week-b', rota.weekB);
  }

  function updateRotaWeek(weekKey, day, checked) {
    var set = rota[weekKey].slice();
    var idx = set.indexOf(day);
    if (checked && idx === -1) set.push(day);
    if (!checked && idx !== -1) set.splice(idx, 1);
    rota[weekKey] = set;
    saveRota();
    render();
  }

  document.getElementById('cal-rota-week-a').addEventListener('change', function (e) {
    var cb = e.target.closest('input[type="checkbox"]');
    if (!cb) return;
    updateRotaWeek('weekA', Number(cb.dataset.day), cb.checked);
  });

  document.getElementById('cal-rota-week-b').addEventListener('change', function (e) {
    var cb = e.target.closest('input[type="checkbox"]');
    if (!cb) return;
    updateRotaWeek('weekB', Number(cb.dataset.day), cb.checked);
  });

  document.getElementById('cal-rota-anchor').addEventListener('change', function (e) {
    if (!e.target.value) return;
    rota.anchorMonday = dateKey(mondayOf(parseKey(e.target.value)));
    e.target.value = rota.anchorMonday; // snap the shown date to that week's Monday
    saveRota();
    render();
  });

  renderRota();

  function asObject(v) {
    return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  }

  document.getElementById('cal-export-btn').addEventListener('click', function () {
    var payload = { notes: notes, holidays: holidays, workOverrides: workOverrides };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'hive-calendar-backup-' + dateKey(today) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    document.getElementById('cal-data-status').textContent = 'Backup downloaded.';
  });

  document.getElementById('cal-import-input').addEventListener('change', function (e) {
    var file = e.target.files[0];
    var statusEl = document.getElementById('cal-data-status');
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var importedNotes = asObject(data.notes);
        var importedHolidays = asObject(data.holidays);
        var importedOverrides = asObject(data.workOverrides);
        var noteCount = Object.keys(importedNotes).length;
        var holidayCount = Object.keys(importedHolidays).length;
        var overrideCount = Object.keys(importedOverrides).length;

        if (!noteCount && !holidayCount && !overrideCount) {
          statusEl.textContent = "That file didn't contain any calendar data.";
          return;
        }

        // Merge rather than replace, so importing a backup never wipes out
        // data already saved on this device -- only adds to or overwrites
        // matching days. But an overwrite is still a real loss for any day
        // that already had something saved, so confirm it first instead of
        // merging silently.
        var overwriteNotes = Object.keys(importedNotes).filter(function (k) { return notes.hasOwnProperty(k); });
        var overwriteHolidays = Object.keys(importedHolidays).filter(function (k) { return holidays.hasOwnProperty(k); });
        var overwriteOverrides = Object.keys(importedOverrides).filter(function (k) { return workOverrides.hasOwnProperty(k); });
        var overwriteParts = [];
        if (overwriteNotes.length) overwriteParts.push(overwriteNotes.length + ' note' + (overwriteNotes.length === 1 ? '' : 's'));
        if (overwriteHolidays.length) overwriteParts.push(overwriteHolidays.length + ' holiday' + (overwriteHolidays.length === 1 ? '' : 's'));
        if (overwriteOverrides.length) overwriteParts.push(overwriteOverrides.length + ' work override' + (overwriteOverrides.length === 1 ? '' : 's'));

        if (overwriteParts.length) {
          var proceed = window.confirm(
            'This backup will overwrite ' + overwriteParts.join(', ') + ' already saved on this device. Continue?'
          );
          if (!proceed) {
            statusEl.textContent = 'Import cancelled — nothing was changed.';
            e.target.value = '';
            return;
          }
        }

        Object.assign(notes, importedNotes);
        Object.assign(holidays, importedHolidays);
        Object.assign(workOverrides, importedOverrides);
        saveNotes();
        saveHolidays();
        saveWorkOverrides();
        render();
        statusEl.textContent = 'Imported ' + noteCount + ' note' + (noteCount === 1 ? '' : 's') +
          ', ' + holidayCount + ' holiday' + (holidayCount === 1 ? '' : 's') +
          ', ' + overrideCount + ' work override' + (overrideCount === 1 ? '' : 's') + '.';
      } catch (err) {
        statusEl.textContent = "Couldn't read that file — is it a Hive Calendar backup?";
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  render();
</script>
</body>
</html>
