<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #070A10;
    --surface: #101B33;
    --surface-2: #17284A;
    --ink: #F1F5FB;
    --ink-soft: #A9BEDE;
    --ink-faint: #869CC0;
    --line: #26406E;
    --accent: #FFC93C;
    --on-accent: #070A10;
    --bad: #F2796B;
    --work: #4D8DFF;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 4rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 1.75rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .back-link:hover { text-decoration: underline; }
  .back-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hero {
    margin-bottom: 2rem;
  }

  h1 {
    margin: 0 0 0.5rem;
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: 2.6rem;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .tagline {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }

  .cal-nav-btn {
    flex: none;
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .cal-nav-btn:hover { border-color: var(--accent); }
  .cal-nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-month-label {
    flex: 1;
    text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 1.35rem;
  }

  .cal-today-row {
    text-align: center;
    margin-bottom: 1.25rem;
  }

  .cal-today-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .cal-today-btn:hover { text-decoration: underline; }
  .cal-today-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-weekdays,
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .cal-weekdays {
    margin-bottom: 0.5rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
  }

  .cal-grid {
    margin-bottom: 1.5rem;
  }

  .cal-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  }

  .cal-day:hover { border-color: var(--accent); }
  .cal-day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-day.is-today { border-color: var(--accent); border-width: 2px; }

  .cal-day.is-selected {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }

  .cal-day.is-selected .cal-day-dot,
  .cal-day.is-selected .cal-day-work-dot { background: var(--on-accent); }

  .cal-day-empty {
    background: none;
    border: none;
    cursor: default;
  }

  /* Work-rota marker (top) and has-a-note marker (bottom) sit on opposite
     edges of the cell so both can show at once without crowding the date
     number, which stays the only flex-centered child. */
  .cal-day-work-dot,
  .cal-day-dot {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
  }

  .cal-day-work-dot {
    top: 6px;
    background: var(--work);
  }

  .cal-day-dot {
    bottom: 6px;
    background: var(--accent);
  }

  .cal-legend {
    display: flex;
    gap: 1.1rem;
    margin: -0.75rem 0 1.5rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
  }

  .cal-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .cal-legend-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: none;
  }

  .cal-legend-dot--work { background: var(--work); }
  .cal-legend-dot--note { background: var(--accent); }

  .cal-note-panel {
    padding: 1rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 1.5rem;
  }

  .cal-note-date {
    margin-bottom: 0.65rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  .cal-note-row {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
  }

  #cal-note-input {
    flex: 1;
    min-width: 0;
    padding: 0.6rem 0.8rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.95rem;
  }

  #cal-note-input::placeholder { color: var(--ink-faint); }
  #cal-note-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-note-row button {
    flex: none;
    padding: 0.6rem 1.05rem;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 6px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .cal-note-row button:hover { filter: brightness(1.08); }
  .cal-note-row button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .cal-note-delete {
    background: none;
    border: none;
    padding: 0;
    color: var(--ink-faint);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .cal-note-delete:hover { color: var(--bad); }
  .cal-note-delete:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-range-panel {
    padding: 1rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 1.5rem;
  }

  .cal-range-title {
    margin-bottom: 0.65rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  .cal-range-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
  }

  .cal-range-row input[type="date"],
  .cal-range-row input[type="text"] {
    padding: 0.6rem 0.8rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.9rem;
    color-scheme: dark;
  }

  .cal-range-row input[type="text"] {
    flex: 1;
    min-width: 140px;
  }

  .cal-range-row input::placeholder { color: var(--ink-faint); }
  .cal-range-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-range-to {
    color: var(--ink-faint);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
  }

  .cal-range-row button {
    flex: none;
    padding: 0.6rem 1.05rem;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 6px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .cal-range-row button:hover { filter: brightness(1.08); }
  .cal-range-row button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #footer {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="/#all-projects">← All projects</a>
  <header class="hero">
    <h1>Calendar</h1>
    <p class="tagline">A month at a glance — click a day to leave yourself a note.</p>
  </header>

  <div class="cal-nav">
    <button type="button" class="cal-nav-btn" id="cal-prev" aria-label="Previous month">←</button>
    <div class="cal-month-label" id="cal-month-label"></div>
    <button type="button" class="cal-nav-btn" id="cal-next" aria-label="Next month">→</button>
  </div>
  <div class="cal-today-row">
    <button type="button" class="cal-today-btn" id="cal-today">Today</button>
  </div>

  <div class="cal-weekdays">
    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
  </div>
  <div class="cal-grid" id="cal-grid-days"></div>
  <div class="cal-legend">
    <span class="cal-legend-item"><span class="cal-legend-dot cal-legend-dot--work" aria-hidden="true"></span>Work day</span>
    <span class="cal-legend-item"><span class="cal-legend-dot cal-legend-dot--note" aria-hidden="true"></span>Has a note</span>
  </div>

  <div class="cal-note-panel">
    <div class="cal-note-date" id="cal-note-date"></div>
    <form class="cal-note-row" id="cal-note-form" autocomplete="off">
      <input type="text" id="cal-note-input" placeholder="Add a note for this day…">
      <button type="submit">Save</button>
    </form>
    <button type="button" class="cal-note-delete" id="cal-note-delete" hidden>Delete note</button>
  </div>

  <div class="cal-range-panel">
    <div class="cal-range-title">Add the same note to a range of days</div>
    <form class="cal-range-row" id="cal-range-form" autocomplete="off">
      <input type="date" id="cal-range-start" aria-label="Start date" required>
      <span class="cal-range-to">to</span>
      <input type="date" id="cal-range-end" aria-label="End date" required>
      <input type="text" id="cal-range-note" placeholder="e.g. Holiday" aria-label="Note text" required>
      <button type="submit">Apply</button>
    </form>
  </div>

  <footer id="footer"></footer>
</div>

<script>
  var STORAGE_KEY = 'hive-calendar-notes';
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  var WEEKDAY_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function loadNotes() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveNotes() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    } catch (e) {}
  }

  var notes = loadNotes();
  var today = new Date();

  // Work rota: a 2-week rotating pattern. Week 0 (the anchor week below,
  // and every 2nd week after/before it) works Wed-Sun; week 1 works
  // Tue-Thu. Update WORK_ROTA_ANCHOR_MONDAY (any Monday that starts a
  // "Wed-Sun" week) if the rota itself ever shifts.
  var WORK_ROTA_ANCHOR_MONDAY = new Date(2026, 8, 14); // Monday, Sep 14 2026
  var WORK_ROTA_WEEKDAYS = [
    [3, 4, 5, 6, 0], // week 0: Wed, Thu, Fri, Sat, Sun
    [2, 3, 4]        // week 1: Tue, Wed, Thu
  ];

  function utcDayCount(d) {
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  function mondayOf(d) {
    var day = d.getDay(); // 0 = Sun .. 6 = Sat
    var diff = day === 0 ? -6 : 1 - day;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  }

  function isWorkDay(d) {
    var weeksSince = Math.floor((utcDayCount(mondayOf(d)) - utcDayCount(WORK_ROTA_ANCHOR_MONDAY)) / 7);
    var weekIndex = ((weeksSince % 2) + 2) % 2; // normalize to 0/1 for negative weeksSince too
    return WORK_ROTA_WEEKDAYS[weekIndex].indexOf(d.getDay()) !== -1;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(key) {
    var parts = key.split('-');
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  function formatLong(d) {
    return WEEKDAY_LONG[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate();
  }

  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();
  var selectedKey = dateKey(today);

  function renderGrid() {
    var first = new Date(viewYear, viewMonth, 1);
    var startOffset = first.getDay();
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    var todayKey = dateKey(today);
    var cells = [];

    for (var i = 0; i < startOffset; i++) {
      cells.push('<div class="cal-day cal-day-empty" aria-hidden="true"></div>');
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var key = viewYear + '-' + pad(viewMonth + 1) + '-' + pad(day);
      var isToday = key === todayKey;
      var isSelected = key === selectedKey;
      var hasNote = !!(notes[key] && notes[key].trim());
      var isWork = isWorkDay(new Date(viewYear, viewMonth, day));
      var label = MONTH_NAMES[viewMonth] + ' ' + day +
        (isWork ? ', work day' : '') + (hasNote ? ', has a note' : '');
      cells.push(
        '<button type="button" class="cal-day' + (isToday ? ' is-today' : '') + (isSelected ? ' is-selected' : '') +
        '" data-key="' + key + '" aria-label="' + label + '" aria-pressed="' + isSelected + '">' +
          (isWork ? '<span class="cal-day-work-dot" aria-hidden="true"></span>' : '') +
          '<span class="cal-day-num">' + day + '</span>' +
          (hasNote ? '<span class="cal-day-dot" aria-hidden="true"></span>' : '') +
        '</button>'
      );
    }

    document.getElementById('cal-grid-days').innerHTML = cells.join('');
    document.getElementById('cal-month-label').textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;
  }

  function renderNotePanel() {
    var d = parseKey(selectedKey);
    document.getElementById('cal-note-date').textContent =
      formatLong(d) + (isWorkDay(d) ? ' · Work day' : '');
    document.getElementById('cal-note-input').value = notes[selectedKey] || '';
    document.getElementById('cal-note-delete').hidden = !notes[selectedKey];
  }

  function renderFooter() {
    var count = Object.keys(notes).filter(function (k) { return notes[k] && notes[k].trim(); }).length;
    document.getElementById('footer').textContent = count
      ? (count === 1 ? '1 note saved' : count + ' notes saved')
      : '';
  }

  function render() {
    renderGrid();
    renderNotePanel();
    renderFooter();
  }

  function goToMonth(year, month) {
    viewYear = year;
    viewMonth = month;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  }

  document.getElementById('cal-prev').addEventListener('click', function () {
    goToMonth(viewYear, viewMonth - 1);
  });
  document.getElementById('cal-next').addEventListener('click', function () {
    goToMonth(viewYear, viewMonth + 1);
  });
  document.getElementById('cal-today').addEventListener('click', function () {
    selectedKey = dateKey(today);
    goToMonth(today.getFullYear(), today.getMonth());
  });

  document.getElementById('cal-grid-days').addEventListener('click', function (e) {
    var btn = e.target.closest('.cal-day[data-key]');
    if (!btn) return;
    selectedKey = btn.dataset.key;
    render();
  });

  document.getElementById('cal-note-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('cal-note-input');
    var text = input.value.trim();
    if (text) {
      notes[selectedKey] = text;
    } else {
      delete notes[selectedKey];
    }
    saveNotes();
    render();
  });

  document.getElementById('cal-note-delete').addEventListener('click', function () {
    delete notes[selectedKey];
    saveNotes();
    render();
  });

  document.getElementById('cal-range-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var startInput = document.getElementById('cal-range-start');
    var endInput = document.getElementById('cal-range-end');
    var text = document.getElementById('cal-range-note').value.trim();
    if (!startInput.value || !endInput.value || !text) return;

    // <input type="date">'s value is always "YYYY-MM-DD", the same shape
    // as our own dateKey()s, so it can be parsed with parseKey() directly.
    var start = parseKey(startInput.value);
    var end = parseKey(endInput.value);
    if (start > end) { var tmp = start; start = end; end = tmp; }

    var cursor = new Date(start);
    while (cursor <= end) {
      notes[dateKey(cursor)] = text;
      cursor.setDate(cursor.getDate() + 1);
    }
    saveNotes();

    selectedKey = dateKey(start);
    goToMonth(start.getFullYear(), start.getMonth());
    e.target.reset();
  });

  render();
</script>
</body>
</html>
