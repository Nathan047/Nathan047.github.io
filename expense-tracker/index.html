<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #070A10;
    --surface: #101B33;
    --surface-2: #17284A;
    --ink: #F1F5FB;
    --ink-soft: #A9BEDE;
    --ink-faint: #869CC0;
    --line: #26406E;
    --accent: #FFC93C;
    --on-accent: #070A10;
    --bad: #F2796B;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 4rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 1.75rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .back-link:hover { text-decoration: underline; }
  .back-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hero {
    margin-bottom: 2rem;
  }

  h1 {
    margin: 0 0 0.5rem;
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: 2.6rem;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .tagline {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  .exp-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }

  .exp-nav-btn {
    flex: none;
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .exp-nav-btn:hover { border-color: var(--accent); }
  .exp-nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .exp-month-label {
    flex: 1;
    text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 1.35rem;
  }

  .exp-today-row {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .exp-today-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .exp-today-btn:hover { text-decoration: underline; }
  .exp-today-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .exp-summary {
    padding: 1.25rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 1.5rem;
  }

  .exp-total-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .exp-total-amount {
    margin: 0.3rem 0 1rem;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 2.2rem;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .exp-cat-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
    font-size: 0.85rem;
  }

  .exp-cat-row:last-child { margin-bottom: 0; }

  .exp-cat-name {
    flex: 0 0 auto;
    width: 8rem;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .exp-cat-bar-track {
    flex: 1;
    min-width: 0;
    height: 6px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }

  .exp-cat-bar-fill {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }

  .exp-cat-amount {
    flex: none;
    min-width: 4rem;
    text-align: right;
    font-family: "IBM Plex Mono", monospace;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .exp-form-panel {
    padding: 1rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 1.5rem;
  }

  .exp-form-title {
    margin-bottom: 0.65rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  .exp-form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .exp-form-row input,
  .exp-form-row select {
    padding: 0.6rem 0.8rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.9rem;
    color-scheme: dark;
  }

  #exp-amount { flex: 1 1 90px; min-width: 90px; }
  #exp-category { flex: 1 1 150px; min-width: 130px; }
  #exp-note { flex: 2 1 160px; min-width: 140px; }
  #exp-date { flex: 1 1 140px; min-width: 140px; }

  .exp-form-row input::placeholder { color: var(--ink-faint); }
  .exp-form-row input:focus-visible,
  .exp-form-row select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .exp-form-row button {
    flex: none;
    padding: 0.6rem 1.05rem;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 6px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .exp-form-row button:hover { filter: brightness(1.08); }
  .exp-form-row button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .exp-list {
    list-style: none;
    margin: 0 0 1.5rem;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .exp-day-label {
    margin: 0.9rem 0 0.1rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .exp-day-label:first-child { margin-top: 0; }

  .exp-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 0.9rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    transition: border-color 0.15s ease;
  }

  .exp-item:hover { border-color: var(--accent); }

  .exp-item-cat {
    flex: none;
    max-width: 7rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .exp-item-note {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .exp-item-amount {
    flex: none;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .exp-item-delete {
    flex: none;
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    transition: color 0.15s ease;
  }

  .exp-item-delete:hover { color: var(--bad); }
  .exp-item-delete:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .exp-empty {
    padding: 1.75rem 1rem;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 6px;
    color: var(--ink-faint);
    font-size: 0.9rem;
  }

  .exp-backup-panel {
    padding: 1rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 1.5rem;
  }

  .exp-backup-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .exp-backup-btn {
    display: inline-flex;
    align-items: center;
    padding: 0.6rem 1.05rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .exp-backup-btn:hover { border-color: var(--accent); }
  .exp-backup-btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  .exp-backup-status {
    margin-top: 0.6rem;
    min-height: 1.1em;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-faint);
  }

  #footer {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="/#all-projects">← All projects</a>
  <header class="hero">
    <h1>Expense Tracker</h1>
    <p class="tagline">Every pound accounted for — log a purchase in two taps.</p>
  </header>

  <div class="exp-nav">
    <button type="button" class="exp-nav-btn" id="exp-prev" aria-label="Previous month">←</button>
    <div class="exp-month-label" id="exp-month-label"></div>
    <button type="button" class="exp-nav-btn" id="exp-next" aria-label="Next month">→</button>
  </div>
  <div class="exp-today-row">
    <button type="button" class="exp-today-btn" id="exp-today">This month</button>
  </div>

  <div class="exp-summary">
    <div class="exp-total-label">Total spent</div>
    <div class="exp-total-amount" id="exp-total-amount">£0.00</div>
    <div id="exp-cat-breakdown"></div>
  </div>

  <div class="exp-form-panel">
    <div class="exp-form-title">Add an expense</div>
    <form class="exp-form-row" id="exp-form" autocomplete="off">
      <input type="number" id="exp-amount" placeholder="0.00" min="0.01" step="0.01" required aria-label="Amount in pounds">
      <select id="exp-category" aria-label="Category"></select>
      <input type="text" id="exp-note" placeholder="What was it for? (optional)" aria-label="Note">
      <input type="date" id="exp-date" aria-label="Date" required>
      <button type="submit">Add</button>
    </form>
  </div>

  <ul class="exp-list" id="exp-list"></ul>

  <div class="exp-backup-panel">
    <div class="exp-form-title">Backup &amp; restore</div>
    <div class="exp-backup-row">
      <button type="button" class="exp-backup-btn" id="exp-export-btn">Export backup</button>
      <label class="exp-backup-btn" for="exp-import-input">
        Import backup
        <input type="file" id="exp-import-input" accept="application/json,.json" hidden>
      </label>
    </div>
    <div class="exp-backup-status" id="exp-backup-status" aria-live="polite"></div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
  var STORAGE_KEY = 'hive-expenses';
  var CATEGORIES = ['Food & Drink', 'Transport', 'Bills & Utilities', 'Shopping', 'Entertainment', 'Health', 'Other'];
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];

  function loadExpenses() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveExpenses() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
      return true;
    } catch (e) {
      return false;
    }
  }

  var expenses = loadExpenses();
  var today = new Date();

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(key) {
    var parts = key.split('-');
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  function isValidDateKey(s) {
    // new Date(y, m, d) rolls over out-of-range components (e.g. month 99)
    // instead of producing an Invalid Date, so isNaN() alone can't catch a
    // malformed-but-numeric date like "2026-99-99" -- round-tripping it back
    // through dateKey() and comparing catches that too.
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var d = parseKey(s);
    return !isNaN(d.getTime()) && dateKey(d) === s;
  }
  function formatMoney(n) { return '£' + n.toFixed(2); }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();

  (function populateCategories() {
    document.getElementById('exp-category').innerHTML = CATEGORIES.map(function (c) {
      return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
    }).join('');
  })();

  document.getElementById('exp-date').value = dateKey(today);

  function monthExpenses() {
    return expenses.filter(function (e) {
      var d = parseKey(e.date);
      return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
    });
  }

  function renderSummary() {
    var list = monthExpenses();
    var total = list.reduce(function (sum, e) { return sum + e.amount; }, 0);
    document.getElementById('exp-total-amount').textContent = formatMoney(total);

    var byCategory = Object.create(null);
    list.forEach(function (e) {
      byCategory[e.category] = (byCategory[e.category] || 0) + e.amount;
    });
    var rows = Object.keys(byCategory).map(function (cat) {
      return { cat: cat, amount: byCategory[cat] };
    }).sort(function (a, b) { return b.amount - a.amount; });

    var breakdownEl = document.getElementById('exp-cat-breakdown');
    breakdownEl.innerHTML = rows.map(function (row) {
      var pct = total > 0 ? Math.round((row.amount / total) * 100) : 0;
      return '<div class="exp-cat-row">' +
        '<span class="exp-cat-name">' + escapeHtml(row.cat) + '</span>' +
        '<span class="exp-cat-bar-track"><span class="exp-cat-bar-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="exp-cat-amount">' + formatMoney(row.amount) + '</span>' +
        '</div>';
    }).join('');
  }

  function renderList() {
    var list = monthExpenses().slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return a.id < b.id ? 1 : -1;
    });

    var listEl = document.getElementById('exp-list');
    if (!list.length) {
      listEl.innerHTML = '<li class="exp-empty">No expenses logged this month.</li>';
      return;
    }

    var html = '';
    var lastDate = null;
    list.forEach(function (e) {
      if (e.date !== lastDate) {
        var d = parseKey(e.date);
        html += '<li class="exp-day-label">' + MONTH_NAMES[d.getMonth()].slice(0, 3) + ' ' + d.getDate() + '</li>';
        lastDate = e.date;
      }
      html += '<li class="exp-item" data-id="' + escapeHtml(e.id) + '">' +
        '<span class="exp-item-cat">' + escapeHtml(e.category) + '</span>' +
        '<span class="exp-item-note">' + (e.note ? escapeHtml(e.note) : '') + '</span>' +
        '<span class="exp-item-amount">' + formatMoney(e.amount) + '</span>' +
        '<button type="button" class="exp-item-delete" data-id="' + escapeHtml(e.id) + '" aria-label="Delete expense">×</button>' +
        '</li>';
    });
    listEl.innerHTML = html;
  }

  function renderFooter() {
    var count = expenses.length;
    document.getElementById('footer').textContent = count
      ? (count === 1 ? '1 expense logged' : count + ' expenses logged')
      : '';
  }

  function render() {
    document.getElementById('exp-month-label').textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;
    renderSummary();
    renderList();
    renderFooter();
  }

  function goToMonth(year, month) {
    viewYear = year;
    viewMonth = month;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  }

  document.getElementById('exp-prev').addEventListener('click', function () { goToMonth(viewYear, viewMonth - 1); });
  document.getElementById('exp-next').addEventListener('click', function () { goToMonth(viewYear, viewMonth + 1); });
  document.getElementById('exp-today').addEventListener('click', function () { goToMonth(today.getFullYear(), today.getMonth()); });

  document.getElementById('exp-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var amountInput = document.getElementById('exp-amount');
    var categorySelect = document.getElementById('exp-category');
    var noteInput = document.getElementById('exp-note');
    var dateInput = document.getElementById('exp-date');

    var amount = parseFloat(amountInput.value);
    if (!amount || amount <= 0 || !dateInput.value) return;

    var entry = {
      id: 'x' + Date.now() + Math.random().toString(36).slice(2, 7),
      date: dateInput.value,
      category: categorySelect.value,
      note: noteInput.value.trim(),
      amount: Math.round(amount * 100) / 100
    };
    expenses.push(entry);
    if (!saveExpenses()) {
      document.getElementById('exp-backup-status').textContent = 'Warning: your data could not be saved to this browser (storage may be full or disabled).';
    }

    var d = parseKey(entry.date);
    goToMonth(d.getFullYear(), d.getMonth());

    amountInput.value = '';
    noteInput.value = '';
    dateInput.value = dateKey(today);
    amountInput.focus();
  });

  document.getElementById('exp-list').addEventListener('click', function (e) {
    var btn = e.target.closest('.exp-item-delete');
    if (!btn) return;
    var id = btn.dataset.id;
    expenses = expenses.filter(function (x) { return x.id !== id; });
    if (!saveExpenses()) {
      document.getElementById('exp-backup-status').textContent = 'Warning: your data could not be saved to this browser (storage may be full or disabled).';
    }
    render();
  });

  function asArray(v) { return Array.isArray(v) ? v : []; }

  document.getElementById('exp-export-btn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify({ expenses: expenses }, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'hive-expenses-backup-' + dateKey(today) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    document.getElementById('exp-backup-status').textContent = 'Backup downloaded.';
  });

  document.getElementById('exp-import-input').addEventListener('change', function (e) {
    var file = e.target.files[0];
    var statusEl = document.getElementById('exp-backup-status');
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var imported = asArray(data.expenses).filter(function (x) {
          return x && typeof x.id === 'string' && x.id.length > 0 && isValidDateKey(x.date) &&
            typeof x.amount === 'number' && isFinite(x.amount) && x.amount > 0;
        }).map(function (x) {
          return {
            id: x.id,
            date: x.date,
            category: (typeof x.category === 'string' && CATEGORIES.indexOf(x.category) !== -1) ? x.category : 'Other',
            note: typeof x.note === 'string' ? x.note : '',
            amount: Math.round(x.amount * 100) / 100
          };
        });

        if (!imported.length) {
          statusEl.textContent = "That file didn't contain any expense data.";
          return;
        }

        // Expenses are identified by id, and importing never edits an
        // existing entry -- only new ids get added -- so re-importing the
        // same backup twice is always safe and needs no overwrite warning.
        var existingIds = Object.create(null);
        expenses.forEach(function (x) { existingIds[x.id] = true; });
        var toAdd = [];
        imported.forEach(function (x) {
          if (existingIds[x.id]) return;
          existingIds[x.id] = true;
          toAdd.push(x);
        });
        var skipped = imported.length - toAdd.length;

        expenses = expenses.concat(toAdd);
        var saveOk = saveExpenses();
        render();
        statusEl.textContent = 'Imported ' + toAdd.length + ' expense' + (toAdd.length === 1 ? '' : 's') +
          (skipped ? ' (' + skipped + ' already present, skipped).' : '.');
        if (!saveOk) {
          statusEl.textContent = 'Warning: your data could not be saved to this browser (storage may be full or disabled).';
        }
      } catch (err) {
        statusEl.textContent = "Couldn't read that file — is it a Hive Expense Tracker backup?";
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  render();
</script>
</body>
</html>
