<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #101d2e;
    --surface: #172943;
    --ink: #e7edf5;
    --ink-soft: #a7bad2;
    --ink-faint: #6d84a0;
    --line: #263c58;
    --accent: #e0a94a;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 4rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 1.75rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .back-link:hover { text-decoration: underline; }
  .back-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hero {
    margin-bottom: 2rem;
  }

  h1 {
    margin: 0 0 0.5rem;
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: 2.6rem;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .tagline {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  #add-form {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
  }

  #new-task {
    flex: 1;
    min-width: 0;
    padding: 0.65rem 0.85rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.95rem;
  }

  #new-task::placeholder { color: var(--ink-faint); }
  #new-task:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #add-form button {
    padding: 0.65rem 1.1rem;
    background: var(--accent);
    color: #1a1406;
    border: none;
    border-radius: 6px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  #add-form button:hover { filter: brightness(1.08); }
  #add-form button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .tasks {
    list-style: none;
    margin: 0 0 1.25rem;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .task {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    max-height: 80px;
    padding: 0.75rem 0.9rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color 0.15s ease, transform 0.15s ease,
      opacity 0.2s ease, max-height 0.2s ease, padding 0.2s ease, margin 0.2s ease;
  }

  .task:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .task.completing {
    opacity: 0;
    transform: scale(0.97);
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin-bottom: -0.6rem;
    border-width: 0;
  }

  .task-check {
    position: relative;
    display: flex;
    align-items: center;
    flex: none;
    cursor: pointer;
  }

  .task-check input {
    position: absolute;
    opacity: 0;
    width: 20px;
    height: 20px;
    margin: 0;
    cursor: pointer;
  }

  .checkmark {
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    display: inline-block;
    position: relative;
    flex: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .task-check input:checked + .checkmark {
    background: var(--accent);
    border-color: var(--accent);
  }

  .task-check input:checked + .checkmark::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid #1a1406;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .task-check input:focus-visible + .checkmark {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .task-text {
    flex: 1;
    font-size: 0.95rem;
    color: var(--ink);
    word-break: break-word;
  }

  .task-delete {
    flex: none;
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    transition: color 0.15s ease;
  }

  .task-delete:hover { color: #d9776a; }
  .task-delete:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty {
    padding: 1.75rem 1rem;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 6px;
    color: var(--ink-faint);
    font-size: 0.9rem;
  }

  #footer {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="/">← The Hive</a>
  <header class="hero">
    <h1>To-Do List</h1>
    <p class="tagline">A running list of what's next.</p>
  </header>
  <form id="add-form" autocomplete="off">
    <input type="text" id="new-task" placeholder="Add a task…" required>
    <button type="submit">Add</button>
  </form>
  <ul id="task-list" class="tasks"></ul>
  <footer id="footer"></footer>
</div>

<script>
  var STORAGE_KEY = 'hive-todo-tasks';
  var DEFAULT_TASKS = [
    { id: 't1', text: 'Make Expense Tracker' },
    { id: 't2', text: 'Make a daily inspirational quote generator' },
    { id: 't3', text: 'Add a calendar' },
    { id: 't4', text: 'Create an app' }
  ];

  function loadTasks() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : DEFAULT_TASKS;
    } catch (e) {
      return DEFAULT_TASKS;
    }
  }

  function saveTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {}
  }

  var tasks = loadTasks();

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderTaskListHTML(list) {
    if (!list.length) {
      return '<li class="empty">Nothing here — add a task above.</li>';
    }
    return list.map(function (t) {
      return '<li class="task" data-id="' + t.id + '">' +
        '<label class="task-check">' +
        '<input type="checkbox" data-action="toggle" data-id="' + t.id + '">' +
        '<span class="checkmark" aria-hidden="true"></span>' +
        '</label>' +
        '<span class="task-text">' + escapeHtml(t.text) + '</span>' +
        '<button type="button" class="task-delete" data-action="delete" data-id="' + t.id + '" aria-label="Delete task">×</button>' +
        '</li>';
    }).join('');
  }

  function render() {
    document.getElementById('task-list').innerHTML = renderTaskListHTML(tasks);
    document.getElementById('footer').textContent = tasks.length
      ? (tasks.length === 1 ? '1 task left' : tasks.length + ' tasks left')
      : '';
  }

  document.getElementById('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('new-task');
    var text = input.value.trim();
    if (!text) return;
    tasks.push({ id: 't' + Date.now() + Math.random().toString(36).slice(2, 7), text: text });
    input.value = '';
    render();
    saveTasks();
  });

  document.getElementById('task-list').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action="delete"]');
    if (btn) {
      tasks = tasks.filter(function (t) { return t.id !== btn.dataset.id; });
      render();
      saveTasks();
    }
  });

  document.getElementById('task-list').addEventListener('change', function (e) {
    var cb = e.target.closest('[data-action="toggle"]');
    if (!cb) return;
    var id = cb.dataset.id;
    var li = cb.closest('.task');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var removeIt = function () {
      tasks = tasks.filter(function (x) { return x.id !== id; });
      render();
      saveTasks();
    };
    if (li && !reduceMotion) {
      li.classList.add('completing');
      setTimeout(removeIt, 220);
    } else {
      removeIt();
    }
  });

  render();
</script>
</body>
</html>
